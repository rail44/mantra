[package]
name = "mantra"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
anyhow = "1"
thiserror = "2"
async-trait = "0.1"

# Parsing
tree-sitter = "0.25"
tree-sitter-go = "0.25"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

# HTTP
reqwest = { version = "0.12", features = ["json"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
regex = "1"
hashbrown = "0.16"
rustc-hash = "2"
fastrand = "2"
parking_lot = "0.12"
jsonrpsee = { version = "0.26", features = ["client", "server", "macros"] }
lsp-types = "0.97"

# LSP Server
tower-lsp-server = "0.22"

# Text management
automerge = "0.5"
crop = { version = "0.4.3", features = ["utf16-metric"] }  # tree-sitter parsing用に維持

[dev-dependencies]
tempfile = "3"
